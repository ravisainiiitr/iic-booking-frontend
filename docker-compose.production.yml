services:
  frontend:
    build:
      context: .
      dockerfile: ./compose/production/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    image: iic_booking_production_frontend
    container_name: iic_booking_production_frontend
    env_file:
      - ./.envs/.production/.frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api}
      - VITE_RESEARCH_COPILOT_ENABLED=${VITE_RESEARCH_COPILOT_ENABLED:-true}
    ports:
      - '8000:80'
    restart: unless-stopped
    healthcheck:
      # Use 127.0.0.1 — alpine wget to localhost can hit ::1 while nginx listens on IPv4 only.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
