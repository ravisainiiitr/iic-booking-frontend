# Frontend Release — hardened (Phase C.1)
# Tag push: verify only. Build/publish: workflow_dispatch only.
name: Frontend Release

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (e.g. v2.5.0-rc1)
        required: true
        type: string
      dry_run:
        type: boolean
        default: true
      publish:
        description: Explicit ECR publish (requires dry_run=false + release-ecr)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  DOCKER_BUILDKIT: '1'
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_PREFIX: ${{ vars.ECR_PREFIX || 'iic' }}

jobs:
  verify_tag:
    runs-on: [self-hosted, windows, iic-build]
    environment: release-build
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      publish: ${{ steps.meta.outputs.publish }}
      mode: ${{ steps.meta.outputs.mode }}
    steps:
      - id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
            $dry = '${{ inputs.dry_run }}'
            $publish = '${{ inputs.publish }}'
            $mode = 'dispatch'
          } else {
            $tag = $env:GITHUB_REF_NAME
            $dry = 'true'
            $publish = 'false'
            $mode = 'tag_verify_only'
          }
          if ($publish -eq 'true' -and $dry -eq 'true') { throw 'publish=true requires dry_run=false' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          "dry_run=$dry" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          fetch-depth: 0
      - id: verify
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $peel = (git rev-list -n 1 '${{ steps.meta.outputs.tag }}').Trim()
          if ($head -ne $peel) { throw "SHA mismatch HEAD=$head peel=$peel" }
          "sha=$head" >> $env:GITHUB_OUTPUT

  npm_build:
    needs: verify_tag
    if: needs.verify_tag.outputs.mode == 'dispatch'
    runs-on: [self-hosted, windows, iic-build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.verify_tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: npm ci + build + route gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          npm run build
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $out = @('dist','build','out') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $out) { throw 'No frontend build output directory' }
          $files = Get-ChildItem $out -Recurse -File
          if ($files.Count -lt 1) { throw 'Build output empty' }
          "bundle_files=$($files.Count)" | Set-Content artifacts/release/bundle-size.txt
          Write-Host "Route/asset gate PASS - $($files.Count) files"

  docker_build:
    needs: [verify_tag, npm_build]
    if: needs.verify_tag.outputs.mode == 'dispatch'
    runs-on: [self-hosted, windows, iic-build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.verify_tag.outputs.tag }}
          fetch-depth: 0
      - name: Build frontend image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ needs.verify_tag.outputs.version }}'
          docker compose -f docker-compose.production.yml build
          docker tag iic_booking_production_frontend "iic_booking_production_frontend:$v"
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $id = (docker image inspect "iic_booking_production_frontend:$v" --format '{{.Id}}').Trim()
          $digest = (docker image inspect "iic_booking_production_frontend:$v" --format '{{index .RepoDigests 0}}' 2>$null)
          @{
            image = "iic_booking_production_frontend:$v"
            id = $id
            digest = "$digest"
            sha = '${{ needs.verify_tag.outputs.sha }}'
          } | ConvertTo-Json | Set-Content artifacts/release/frontend-image.json -Encoding utf8
          @(
            '# Docker image ID (NOT installer SHA256)'
            "$id  iic_booking_production_frontend:$v"
          ) | Set-Content artifacts/release/docker-image-ids.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release-${{ needs.verify_tag.outputs.version }}
          path: artifacts/release/
          retention-days: 90

  publish_gate:
    needs: [verify_tag, docker_build]
    if: needs.verify_tag.outputs.mode == 'dispatch' && needs.verify_tag.outputs.publish == 'true' && needs.verify_tag.outputs.dry_run != 'true'
    runs-on: [self-hosted, windows, iic-build]
    steps:
      - name: Assert publish gate
        shell: pwsh
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          AWS_ROLE_ARN_ECR_PUSH: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ECR_REGISTRY) { throw 'Missing ECR_REGISTRY variable' }
          if (-not $env:AWS_ROLE_ARN_ECR_PUSH) { throw 'Missing AWS_ROLE_ARN_ECR_PUSH secret for environment release-ecr' }
          if ('${{ github.event_name }}' -ne 'workflow_dispatch') { throw 'Publish requires workflow_dispatch' }
          Write-Host 'PUBLISH_GATE_OK'

  push_ecr:
    needs: [verify_tag, docker_build, publish_gate]
    if: needs.verify_tag.outputs.mode == 'dispatch' && needs.verify_tag.outputs.publish == 'true' && needs.verify_tag.outputs.dry_run != 'true'
    runs-on: [self-hosted, windows, iic-build]
    environment: release-ecr
    steps:
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Push frontend image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ needs.verify_tag.outputs.version }}'
          aws ecr get-login-password --region $env:AWS_REGION | docker login --username AWS --password-stdin $env:ECR_REGISTRY
          $dst = "$($env:ECR_REGISTRY)/$($env:ECR_PREFIX)/booking-frontend:$v"
          docker tag "iic_booking_production_frontend:$v" $dst
          docker push $dst
          docker logout $env:ECR_REGISTRY

  tag_verify_complete:
    needs: verify_tag
    if: needs.verify_tag.outputs.mode == 'tag_verify_only'
    runs-on: [self-hosted, windows, iic-build]
    steps:
      - shell: pwsh
        run: Write-Host "Tag verified ${{ needs.verify_tag.outputs.tag }} @ ${{ needs.verify_tag.outputs.sha }} (no build/publish)"
