<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/iitr-logo-64.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <!-- viewport-fit=cover lets the layout use the full screen on notched phones; fixed/sticky chrome pads itself
         with env(safe-area-inset-*). Pinch-zoom stays enabled for accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The portal has its own light and dark themes (it follows the phone/OS setting), so browsers and the
         Android WebView must not apply their automatic darkening on top of it. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Browser UI (Android address bar, Safari tab bar) matches the header surface in each OS theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151d2a" />
    <!-- First paint uses the right page colour before the stylesheet arrives (no white flash in dark mode). -->
    <style>
      html { background: #fbfcfd; color: #0f1d33; }
      #app-loading { color: #515e70; }
      @media (prefers-color-scheme: dark) {
        html { background: #0c111a; color: #f0f4f8; }
        #app-loading { color: #a8b5c7; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the IITRBanner Hindi line uses this font; `text=` must list its characters (update if that text changes). -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600&display=swap&text=%E0%A4%82%E0%A4%95%E0%A4%97%E0%A4%A1%E0%A4%A4%E0%A4%A5%E0%A4%A6%E0%A4%A8%E0%A4%AA%E0%A4%AD%E0%A4%AF%E0%A4%B0%E0%A4%B8%E0%A4%BC%E0%A4%BE%E0%A4%BF%E0%A5%80%E0%A5%81%E0%A5%8B%E0%A5%8C%E0%A5%8D" rel="stylesheet" />
    <title>Institute Equipment Booking Portal | IIT Roorkee</title>
    <meta name="description" content="Institute-wide equipment booking for IIT Roorkee departments, centres, and laboratories. Real-time scheduling for students, faculty, and external researchers." />
    <meta name="author" content="IIT Roorkee" />

    <meta property="og:title" content="Institute Equipment Booking Portal | IIT Roorkee" />
    <meta property="og:description" content="Book laboratory instruments across IIT Roorkee departments, centres, and laboratories — real-time scheduling for campus and external users." />
    <meta property="og:type" content="website" />

  </head>
